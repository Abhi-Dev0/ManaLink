services:
  traefik:
    image: traefik:v3.7.1
    container_name: traefik
    ports:
      - "80:80"
      - "8080:8080"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./config/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - service-network

networks:
  service-network:
    external: false